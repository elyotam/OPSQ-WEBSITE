name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Static export can't include server code or the internal brand-study pages.
      - run: node scripts/prepare-static.mjs
      - run: npx next build
        env:
          STATIC_EXPORT: "1"
          NEXT_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_STATIC_EXPORT: "1"
          NEXT_PUBLIC_DEMO_EMAIL: ${{ vars.DEMO_EMAIL }}
      # The root serves the Hebrew page itself (no redirect), so it can never open in another language.
      - run: cp out/he/index.html out/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
